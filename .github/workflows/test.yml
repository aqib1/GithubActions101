name: test-project
on: push
jobs:
    tests:
       runs-on: ubuntu-latest
       steps:
        - name: Get code
          uses: actions/checkout@v7
        - name: Setup python
          uses: actions/setup-python@v6
          with:
            python-version: '3.14'
        - name: Install uv
          uses: astral-sh/setup-uv@v6
          with:
            enable-cache: true
        - name: Install Dependencies
          run: uv sync --locked    
        - name: Run Project
          run: uv run --locked main.py
